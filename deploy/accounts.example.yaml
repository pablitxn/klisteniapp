# OPTIONAL KUBERNETES BLUEPRINT, never applied by public CI.
# Replace example.test, namespace, image and Secret references in your own
# operator repository. Provision your own database and network/TLS policies.
# Run the migration command with this exact API image before promoting it.
# This file deliberately does not configure an ingress, shared database or
# another service's NetworkPolicy; those depend on the operator's environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: klisteni-api-config
  namespace: klisteni
data:
  NODE_ENV: production
  APP_ORIGIN: https://fitness.example.test
  HOST: 0.0.0.0
  PORT: "3001"
  BILLING_MODE: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klisteni-api
  namespace: klisteni
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: klisteni-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: klisteni-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: REPLACE_WITH_YOUR_API_IMAGE_AT_SHA256_DIGEST
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef: { name: klisteni-api-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: klisteni-api-runtime, key: DATABASE_URL }
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: klisteni-api-runtime, key: BETTER_AUTH_SECRET }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: klisteni-api
  namespace: klisteni
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: klisteni-api }
  ports:
    - { name: http, port: 3001, targetPort: http }
