# Only the reviewed Umami tracker and event collector cross this proxy.
# The upstream is the private observability WireGuard address, with its public
# hostname used for Host/SNI/certificate validation. No DNS/TLS bypass is used.
location = /umami/script.js {
  limit_except GET { deny all; }
  proxy_pass https://10.66.66.10/script.js;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_ssl_name umami.orchid-labs.xyz;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_pass_request_headers off;
  proxy_set_header Host umami.orchid-labs.xyz;
  proxy_hide_header Set-Cookie;
  proxy_hide_header Cache-Control;
  proxy_connect_timeout 5s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;
}

location = /umami/api/send {
  limit_except POST { deny all; }
  if ($umami_origin_allowed = 0) { return 403; }
  if ($umami_fetch_site_allowed = 0) { return 403; }
  if ($umami_json_allowed = 0) { return 415; }
  client_max_body_size 32k;
  proxy_pass https://10.66.66.10/api/send;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_ssl_name umami.orchid-labs.xyz;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_pass_request_headers off;
  proxy_set_header Host umami.orchid-labs.xyz;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header User-Agent $http_user_agent;
  proxy_set_header x-umami-cache $http_x_umami_cache;
  proxy_set_header x-umami-website-id ac451943-95f5-4b3e-8c49-33d17c4f511c;
  proxy_set_header x-umami-hostname klisteniapp.orchid-labs.xyz;
  # Only the Cloudflare Tunnel -> Traefik ingress may reach this server.
  # The deployment NetworkPolicy enforces that trust boundary. Do not accept
  # untrusted direct ingress, or these incoming client-IP headers are spoofable.
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  # Deliberately omit CF-IPCountry: a country-only header suppresses Umami's
  # GeoIP fallback and therefore region detection. Never request browser GPS.
  proxy_hide_header Set-Cookie;
  proxy_hide_header Cache-Control;
  proxy_connect_timeout 5s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;
  proxy_buffering off;
}

location = /umami { return 404; }
location ^~ /umami/ { return 404; }
