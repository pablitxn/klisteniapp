worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Avoid logging URLs, query strings, invitation fragments or personal data.
  log_format operational '{"status":$status,"bytes":$body_bytes_sent,"time":$request_time}';
  access_log /dev/stdout operational;
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  upstream b2b_backend { server b2b-api:4201; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ^~ /api/b2b/ {
      # Raw uploads are validated and authorized by B2B; never serve its volume directly.
      client_max_body_size 32m;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass http://b2b_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      add_header Cache-Control no-store always;
    }
    location = /api { return 404; }
    location /api/ { return 404; }
    location = /backoffice { return 308 /backoffice/; }
    location /backoffice/ { try_files $uri $uri/ /backoffice/index.html; }
    location ~ ^/(?:backoffice/)?(?:assets|models|previews)/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
