worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  log_not_found off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Emit fixed route categories, never user-controlled URLs or header contents.
  map $uri $route_class {
    default page;
    ~^/assets/ asset;
    ~^/models/ model;
    ~^/previews/ preview;
    ~^/umami(?:/|$) analytics;
    ~^/api(?:/|$) api;
    /healthz health;
  }
  map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    /healthz "no-store";
    ~^/umami/ "no-store";
    ~^/api(?:/|$) "no-store";
  }
  log_format operational escape=json
    '{"time":"$time_iso8601","service":"klisteniapp",'
    '"request_id":"$request_id","method":"$request_method",'
    '"route":"$route_class","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time}';
  access_log /dev/stdout operational;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/wasm image/svg+xml text/css;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Analytics has no route or upstream in the public distribution.
    location = /umami { return 404; }
    location ^~ /umami/ { return 404; }

    # An operator may route /api to an independently configured same-origin API.
    # A static-only deployment must never answer an API request with SPA HTML.
    location = /api { default_type application/json; return 503 '{"error":"El servicio de cuentas no está disponible."}'; }
    location ^~ /api/ { default_type application/json; return 503 '{"error":"El servicio de cuentas no está disponible."}'; }

    # Missing assets must remain 404, rather than returning the SPA HTML.
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /models/ { try_files $uri =404; }
    location ^~ /previews/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
